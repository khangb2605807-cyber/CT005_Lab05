<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Infographic về lợi ích của công nghệ số trong học tập và video YouTube liên quan.">
  <title>Lợi ích của công nghệ số trong học tập</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem 1rem;
      color: #172554;
      background: #f8fafc;
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 900px);
      margin: 0 auto;
    }

    header,
    section,
    footer {
      margin-bottom: 2rem;
    }

    h1,
    h2 {
      line-height: 1.25;
    }

    header {
      text-align: center;
    }

    .infographic {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgb(15 23 42 / 12%);
    }

    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 12px;
      background: #0f172a;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    footer {
      padding-top: 1rem;
      border-top: 1px solid #cbd5e1;
      color: #475569;
      font-size: 0.9rem;
      text-align: center;
    }

    footer p {
      margin: 0.25rem 0;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Lợi ích của công nghệ số trong học tập</h1>
      <p>Khám phá cách công nghệ số giúp người học tiếp cận kiến thức, phát triển kỹ năng và học tập hiệu quả hơn.</p>
    </header>

    <section aria-labelledby="infographic-title">
      <h2 id="infographic-title">Infographic: Công nghệ số trong học tập</h2>
      <img
        class="infographic"
        src="Lab05_Ex2.1.png.png"
        alt="Infographic trình bày năm lợi ích của công nghệ số trong học tập: truy cập thông tin, phát triển tư duy phản biện, học tập tương tác, theo dõi tiến độ và tăng động lực."
      >
    </section>

    <section aria-labelledby="video-title">
      <h2 id="video-title">Video YouTube</h2>
      <div class="video-container">
        <iframe
          src="https://www.youtube.com/embed/Do9Rs46IBOE"
          title="Video YouTube về công nghệ số trong học tập"
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>
      </div>
    </section>

    <footer>
      <p>&copy; 2026. Bản quyền thuộc về tác giả nội dung.</p>
      <p>Mã nguồn được hỗ trợ bởi GitHub Copilot.</p>
    </footer>
  </main>
</body>
</html>
